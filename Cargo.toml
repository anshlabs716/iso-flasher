[package]
name = "iso-flasher"
version = "2.0.0"
edition = "2021"
description = "Fast, lightweight, no-bloat ISO-to-USB flasher"
license = "MIT"

[dependencies]
# XDG Desktop Portal client. Used for the standards-based native file chooser
# (org.freedesktop.portal.FileChooser) so the desktop's own dialog is shown.
zbus = { version = "5", features = ["blocking-api"] }

# GTK4 for the optional graphical window (`iso-flasher --gui`). Only linked in
# when the `gui` feature is enabled, so the CLI stays dependency-light.
gtk = { version = "0.11", package = "gtk4", optional = true }

[features]
default = []
gui = ["dep:gtk"]

[[bin]]
name = "iso-flasher"
path = "src/main.rs"
